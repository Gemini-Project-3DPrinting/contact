<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Gemini Project — Instagram и Telegram.">
  <title>Gemini Project</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 40px 20px; background: #fff; color: #141217; font-family: Arial, Helvetica, sans-serif; }
    main { width: 100%; max-width: 520px; }
    .logo { position: relative; overflow: hidden; aspect-ratio: 2.5; margin: 0 0 42px; }
    .logo img { position: absolute; width: 125%; max-width: none; height: auto; left: -12.5%; top: 50%; transform: translateY(-53%); }
    nav { display: grid; gap: 14px; max-width: 380px; margin: auto; }
    a { display: flex; align-items: center; gap: 16px; min-height: 76px; padding: 17px 22px; border: 1px solid #e5dcec; border-radius: 18px; text-decoration: none; color: inherit; background: #fff; transition: border-color .18s, background .18s, transform .18s; }
    a:hover { border-color: #8500d5; background: #fbf7ff; transform: translateY(-2px); }
    a:focus-visible { outline: 3px solid #8500d5; outline-offset: 5px; }
    svg { width: 26px; height: 26px; flex-shrink: 0; color: #8500d5; }
    .text { min-width: 0; }
    strong { display: block; font-size: 17px; font-weight: 600; }
    small { display: block; margin-top: 5px; font-size: 12px; color: #6a626f; overflow-wrap: anywhere; }
    .arrow { margin-left: auto; color: #8500d5; font-size: 23px; }
    @media (max-width: 380px) { body { padding: 32px 18px; } .logo { margin-bottom: 30px; } a { padding: 16px; gap: 12px; } }
    @media (prefers-reduced-motion: reduce) { a { transition: none; } a:hover { transform: none; } }
  </style>
</head>
<body>
  <main aria-label="Gemini Project">
    <div class="logo"><img src="assets/logo.jpg" alt="Gemini Project" width="2048" height="2047" fetchpriority="high"></div>
    <nav aria-label="Социальные сети">
      <a href="https://www.instagram.com/gemini_3dprint/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
        <span class="text"><strong>Instagram</strong><small>@gemini_3dprint</small></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a href="https://t.me/geminiproject_3dprinting">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.7 3.4 18.4 20c-.25 1.18-.9 1.47-1.83.92l-5.03-3.71-2.43 2.34c-.27.27-.5.5-1.02.5l.36-5.12 9.32-8.42c.4-.36-.09-.56-.62-.2L5.63 13.56.69 12.02c-1.07-.34-1.09-1.07.22-1.58L20.2 3c.89-.33 1.67.2 1.5.4Z"/></svg>
        <span class="text"><strong>Telegram</strong><small>@geminiproject_3dprinting</small></span><span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
  </main>
</body>
</html>
